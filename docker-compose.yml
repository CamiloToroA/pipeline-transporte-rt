version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_transporte
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: transporte_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d transporte_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    container_name: gtfs_pipeline_scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=transporte_db
    restart: always

volumes:
  postgres_data:
